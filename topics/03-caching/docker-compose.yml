services:
  web:
    build: ./app
    container_name: caching-web
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TTL: 60
      CACHE_TTL_JITTER: "30"
      USE_CACHE_LOCK: "true"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: caching-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data: