services:
  backend1:
    build: .
    container_name: lb-backend-1
    environment:
      INSTANCE_ID: backend-1
      INSTANCE_CAPACITY: normal
    ports:
      - "5001:5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 3

  backend2:
    build: .
    container_name: lb-backend-2
    environment:
      INSTANCE_ID: backend-2
      INSTANCE_CAPACITY: normal
    ports:
      - "5002:5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 3

  backend3:
    build: .
    container_name: lb-backend-3
    environment:
      INSTANCE_ID: backend-3
      INSTANCE_CAPACITY: normal
    ports:
      - "5003:5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 3
  
  nginx:
    image: nginx:alpine
    container_name: lb-nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/least-connections.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
    restart: unless-stopped