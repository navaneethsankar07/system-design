proxy_cache_path /var/cache/nginx/cdn
    levels=1:2
    keys_zone=cdn_cache:10m
    max_size=100m
    inactive=10m
    use_temp_path=off;

upstream django_origin {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    # Cacheable API endpoint
    location /api/products/ {
        proxy_pass http://django_origin;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache cdn_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_methods GET HEAD;

        proxy_cache_valid 200 30s;
        proxy_cache_lock on;

        proxy_cache_use_stale
            error timeout updating
            http_500 http_502 http_503 http_504;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Edge-Server "nginx-edge" always;
    }

    # Health endpoint must never be cached
    location /api/health/ {
        proxy_pass http://django_origin;

        proxy_set_header Host $host;
        proxy_cache off;

        add_header X-Cache-Status "BYPASS" always;
    }

    # Static assets are served directly by Nginx
    location /assets/ {
        alias /usr/share/nginx/html/assets/;

        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Asset-Server "nginx-edge";
    }

    location / {
        default_type text/plain;
        return 200 "CDN simulation is running. Try /api/products/ or /api/health/ or /assets/sample.txt\n";
    }
}
